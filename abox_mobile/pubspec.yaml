name: abox_mobile
description: "ABox - Next-Gen Real-time AI Voice Changer for Calling & Gaming"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Utilities
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.0
  intl: ^0.19.0

  # Networking & Laravel REST API
  http: ^1.2.0

  # Audio & Media
  audioplayers: ^5.2.1
  record: ^5.1.2
  path_provider: ^2.1.2
  share_plus: ^7.2.2

  # UI & Icons
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/voices/
    - assets/images/apps/
